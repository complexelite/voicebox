services:
  voicebox:
    image: ghcr.io/complexelite/voicebox:0.6.1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTORCH_VARIANT: cpu
    restart: unless-stopped
    expose:
      - "17493"
    environment:
      VOICEBOX_API_KEY: ${VOICEBOX_API_KEY:?Set VOICEBOX_API_KEY in Dokploy secrets}
      VOICEBOX_REQUIRE_AUTH: "1"
      VOICEBOX_PUBLIC_ORIGIN: https://voicebox.complexelite.com
      VOICEBOX_MODELS_DIR: /app/data/models
      HF_HUB_CACHE: /home/voicebox/.cache/huggingface
      NUMBA_CACHE_DIR: /tmp/numba_cache
      LOG_LEVEL: info
    volumes:
      - voicebox-data-v2:/app/data
      - voicebox-model-cache:/home/voicebox/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:17493/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 6G
        reservations:
          cpus: "0.50"
          memory: 1G
volumes:
  voicebox-data-v2:
  voicebox-model-cache:
